<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Montagem - TREVO</title>
    <style>
        :root {
            --bg: #f6f3ee;
            --card: #ffffff;
            --text: #2d3748;
            --muted: #718096;
            --border: #e2e8f0;
            --primary: #3c4442;
            --danger: #e53e3e;
            --day-head-bg: #fff7ed;
            --task-bg: #ffffff;
            --control-bg: rgba(0,0,0,0.03);
            --shadow: rgba(45, 55, 72, 0.06);
        }

        .dark {
            --bg: #1a1a2e;
            --card: #16213e;
            --text: #e2e8f0;
            --muted: #a0aec0;
            --border: #2d3748;
            --primary: #a0aec0;
            --danger: #fc8181;
            --day-head-bg: #1a2744;
            --task-bg: #16213e;
            --control-bg: rgba(255,255,255,0.05);
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: #000000;
            color: #ffffff;
            border-radius: 12px;
        }

        .user-badge {
            position: absolute;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.12);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }

        .user-badge:hover {
            background: rgba(255,255,255,0.2);
        }

        h1 {
            margin: 0;
            font-size: clamp(1rem, 2.4vw, 1.35rem);
            line-height: 1.15;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            align-items: start;
        }

        .day {
            min-height: 170px;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 5px solid var(--primary);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px var(--shadow);
        }

        .day-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 9px;
            background: var(--day-head-bg);
            border-bottom: 1px solid var(--border);
        }

        .day-title {
            flex: 1;
            text-align: center;
            font-weight: 850;
            color: var(--primary);
            font-size: 0.9rem;
            outline: none;
            border-radius: 7px;
            padding: 3px 4px;
        }

        .day-title:focus,
        .task-text:focus {
            background: var(--day-head-bg);
            outline: 2px solid var(--primary);
        }

        .add-task,
        .trash-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #fbd38d;
            background: #ffffff;
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trash-btn.has-trash {
            border-color: var(--danger);
            color: var(--danger);
        }

        .tasks {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 8px;
        }

        .task {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px 7px;
            background: var(--task-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: grab;
            transition: opacity 0.2s, transform 0.2s;
        }

        .task:active { cursor: grabbing; }

        .task.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .task.drag-over {
            border: 2px dashed var(--primary);
        }

        .task.highlight {
            animation: pulse 0.6s ease-in-out 3;
            border-color: #f6e05e;
            box-shadow: 0 0 12px rgba(246, 224, 94, 0.5);
        }

        .task.status-pendente {
            background: var(--task-bg);
        }

        .task.status-urgente {
            background: linear-gradient(0deg, rgba(229, 62, 62, 0.12), rgba(229, 62, 62, 0.12)), var(--task-bg);
            border-color: rgba(229, 62, 62, 0.35);
        }

        .task.status-atrasado {
            background: linear-gradient(0deg, rgba(197, 48, 48, 0.32), rgba(197, 48, 48, 0.32)), var(--task-bg);
            border-color: rgba(197, 48, 48, 0.75);
            box-shadow: 0 0 14px rgba(197, 48, 48, 0.2);
        }

        .task.status-andamento {
            background: linear-gradient(0deg, rgba(246, 224, 94, 0.16), rgba(246, 224, 94, 0.16)), var(--task-bg);
            border-color: rgba(214, 158, 46, 0.35);
        }

        .task.status-concluido {
            background: linear-gradient(0deg, rgba(56, 161, 105, 0.13), rgba(56, 161, 105, 0.13)), var(--task-bg);
            border-color: rgba(56, 161, 105, 0.35);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 4px rgba(246, 224, 94, 0.3); }
            50% { box-shadow: 0 0 16px rgba(246, 224, 94, 0.7); }
        }

        .task-row {
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .task-controls {
            display: flex;
            flex-direction: row;
            gap: 2px;
            align-items: center;
        }

        .responsavel {
            width: auto;
            min-width: 46px;
            height: 20px;
            padding: 0 2px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--control-bg);
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: 800;
            text-align: center;
            color: var(--text);
            appearance: none;
        }

        .resp-André { color: #3182ce; }
        .resp-Tavares { color: #e53e3e; }
        .resp-Morgan { color: #805ad5; }
        .resp-Juarez { color: #dd6b20; }

        .horario {
            width: 36px;
            height: 20px;
            padding: 0 1px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--control-bg);
            font-size: 0.65rem;
            text-align: center;
            color: var(--text);
            outline: none;
        }

        .horario:focus {
            border-color: var(--primary);
        }

        .task-text {
            min-height: 22px;
            line-height: 1.25;
            font-size: 0.84rem;
            outline: none;
            border-radius: 7px;
            padding: 3px 4px;
            cursor: text;
        }

        .status {
            width: auto;
            min-width: 78px;
            height: 20px;
            padding: 0 3px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--control-bg);
            cursor: pointer;
            font-size: 0.6rem;
            text-align: center;
            appearance: none;
        }

        .delete {
            width: 18px;
            height: 18px;
            border: 1px solid var(--border);
            background: var(--control-bg);
            color: var(--danger);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete:hover {
            background: #fed7d7;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            width: 90%;
            max-width: 440px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .modal h2 {
            margin: 0 0 14px;
            font-size: 1rem;
            color: var(--primary);
        }

        .modal-close {
            float: right;
            border: none;
            background: transparent;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--muted);
        }

        .trash-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.82rem;
        }

        .trash-item-text {
            flex: 1;
            color: var(--text);
        }

        .trash-item-actions {
            display: flex;
            gap: 4px;
        }

        .trash-item-actions button {
            border: 1px solid var(--border);
            background: var(--control-bg);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 2px 7px;
        }

        .trash-restore {
            color: #38a169;
        }

        .trash-restore:hover {
            background: #c6f6d5;
        }

        .trash-permadelete {
            color: var(--danger);
        }

        .trash-permadelete:hover {
            background: #fed7d7;
        }

        .trash-empty {
            text-align: center;
            color: var(--muted);
            padding: 20px;
            font-size: 0.85rem;
        }

        .theme-toggle {
            position: absolute;
            left: 14px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ffffff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            line-height: 1;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.2);
        }

        .search-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--primary);
        }

        .search-bar button {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .search-bar select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            outline: none;
            min-width: 130px;
        }

        .search-bar select:focus {
            border-color: var(--primary);
        }

        @media (max-width: 700px) {
            body {
                padding: 8px;
            }

            .calendar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <button id="themeToggle" class="theme-toggle" onclick="alternarTema()" title="Alternar tema">🌙</button>
        <h1>🎪 PLANEJAMENTO TREVO</h1>
        <span id="userBadge" class="user-badge" onclick="selecionarUsuario()" title="Trocar usuário">👤 ...</span>
    </header>

    <div class="search-bar">
        <input id="searchInput" type="text" placeholder="🔍 Buscar tarefa..." oninput="buscarTarefa()">
        <select id="responsavelFilter" onchange="aplicarFiltros()" title="Filtrar por responsável">
            <option value="">Filtrar: Todos</option>
            <option value="André">🦾 André</option>
            <option value="Morgan">🕷️ Morgan</option>
            <option value="Juarez">🥷 Juarez</option>
            <option value="Tavares">💪 Tavares</option>
            <option value="_sem_responsavel">Sem responsável</option>
        </select>
        <button onclick="analisarComIA()" title="Gerar análise automática com IA">🤖 IA</button>
        <button onclick="copiarStatusGeral()" title="Copiar status geral das tarefas">📋 Status</button>
        <button onclick="limparBusca()" title="Limpar">✕</button>
    </div>

    <main id="calendar" class="calendar"></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const STORAGE_KEY = 'cronograma-montagem-simplificado-v3';
        const USUARIO_KEY = 'cronograma-usuario-atual';
        const TEMA_KEY = 'cronograma-tema';
        const SUPABASE_URL = 'https://xorfmikxqmyischizdap.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2lcPlg9nKDuVFh1EhVx2Ew_de06S8iX';
        const SUPABASE_TABLE = 'cronograma';
        const SUPABASE_ROW_ID = 'principal';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioAtual = localStorage.getItem(USUARIO_KEY) || 'Tavares';
        let dragDiaIdx = null;
        let dragTarefaIdx = null;
        let salvandoSupabase = false;
        let alertaPiscando = false;

        const dadosIniciais = [
            { data: '16/05 (Sábado)', tarefas: [
                { tarefa: 'Recebimento do projeto 3D', status: 'pendente' },
                { tarefa: 'Conferir medidas e ajustes do layout', status: 'pendente' },
                { tarefa: 'Envio dos ajustes necessários para edição do projeto + Arquivos em Vetor', status: 'pendente' },
                { tarefa: 'Contato com possíveis patrocinadores, Larissa Madeira (Mastercard), Omoda Jaecco, Davi Fagundes (Avatim)', status: 'pendente' },
                { tarefa: 'Planilha com contato de todos os fornecedores setorizados por tipo de entrega', status: 'pendente' },
                { tarefa: 'Organização da planilha de tarefas futuras para o evento', status: 'pendente' }
            ] },
            { data: '17/05 (Domingo)', tarefas: [
                { tarefa: 'Pagar de doido e perguntar no grupo se segunda já vão apresentar o 3D e já solicitar também o detalhamento das prioridades de execução', status: 'pendente', horario: '10:00' },
                { tarefa: 'Mapear novos fornecedores, entrar em contato com os que já tiver, procurar pessoas pra suporte na montagem do evento', status: 'pendente' },
                { tarefa: 'Confirmar medida executada da estrutura de box struss (18m ou 16m?)', status: 'pendente' },
                { tarefa: 'Cardápio do evento', status: 'pendente' },
                { tarefa: 'Entender como ativar a Valor dentro do espaço do evento', status: 'pendente' },
                { tarefa: 'Confirmar o momento em que o Dry Wall vai estar executado', status: 'pendente' },
                { tarefa: 'HISTÓRICO DE COMPRAS MERCADO LIVRE - DESCARTÁVEIS', status: 'pendente' }
            ] },
            { data: '18/05 (Segunda)', tarefas: [
                { tarefa: 'Cobrar Detalhamento Arquitetos', status: 'pendente', horario: '08:00' },
                { tarefa: 'Contactar Fornecedores', status: 'pendente' },
                { tarefa: 'Cobrar Retorno: Heineken, Pernod, Diageo, Red Bull, Ballena + Outros possíveis patrocinadores)', status: 'pendente' },
                { tarefa: 'Compra bancos de plastico, Espelho Concavo, Shimmer, Portas Sanfonadas', status: 'pendente' },
                { tarefa: 'Entender quantidade de bandeirolas e mandar fazer', status: 'pendente' },
                { tarefa: 'MANDAR INSTALAR PONTO DE ENERGIA NO LOCAL', status: 'pendente' },
                { tarefa: 'MANDAR INSTALAR PONTO DE ÁGUA NO LOCAL', status: 'pendente' },
                { tarefa: 'ALUGAR MOBILIA DE DESCANSO NA ACCERVO', status: 'pendente' }
            ] },
            { data: '19/05 (Terça)', tarefas: [
                { tarefa: 'Pré-produção e compras pendentes', status: 'pendente' }
            ] },
            { data: '20/05 -  (Quarta) Dry Wall realizado?', tarefas: [
                { tarefa: 'Ligação de energia geral', status: 'pendente' },
                { tarefa: 'Ligação de água e esgoto dos banheiros', status: 'pendente' },
                { tarefa: 'Início do cabeamento elétrico interno', status: 'pendente' },
                { tarefa: 'Malhas tensionadas no aéreo do box truss', status: 'pendente' }
            ] },
            { data: '21/05 (Quinta)', tarefas: [
                { tarefa: 'Continuação da elétrica', status: 'pendente' },
                { tarefa: 'Montagem das estruturas de metalon', status: 'pendente' },
                { tarefa: 'Montagem das estruturas de madeira', status: 'pendente' }
            ] },
            { data: '22/05 (Sexta)', tarefas: [
                { tarefa: 'Teste de tomadas e circuitos', status: 'pendente' },
                { tarefa: 'Ajustes de marcenaria e serralheria', status: 'pendente' },
                { tarefa: 'Recebimento de lonas e adesivos', status: 'pendente' }
            ] },
            { data: '23/05 (Sábado)', tarefas: [
                { tarefa: 'Aplicação de adesivos nas paredes', status: 'pendente' },
                { tarefa: 'Instalação de lonas impressas', status: 'pendente' },
                { tarefa: 'Instalação das portas sanfonadas', status: 'pendente' }
            ] },
            { data: '24/05 (Domingo)', tarefas: [
                { tarefa: 'Retoques de adesivos', status: 'pendente' },
                { tarefa: 'Fixação das prateleiras dos banheiros', status: 'pendente' }
            ] },
            { data: '25/05 (Segunda)', tarefas: [
                { tarefa: 'Instalação dos letreiros luminosos', status: 'pendente' },
                { tarefa: 'Instalação das fitas de neon', status: 'pendente' }
            ] },
            { data: '26/05 (Terça)', tarefas: [
                { tarefa: 'Teste de carga total', status: 'pendente' },
                { tarefa: 'Limpeza grossa', status: 'pendente' }
            ] },
            { data: '27/05 (Quarta)', tarefas: [
                { tarefa: 'Entrada do mobiliário', status: 'pendente' },
                { tarefa: 'Entrada de freezers, chopeiras e bar', status: 'pendente' }
            ] },
            { data: '28/05 (Quinta)', tarefas: [
                { tarefa: 'Paisagismo e decoração final', status: 'pendente' },
                { tarefa: 'Abastecimento dos bares', status: 'pendente' },
                { tarefa: 'Limpeza fina', status: 'pendente' }
            ] },
            { data: '29/05 (Sexta)', tarefas: [
                { tarefa: 'Vistoria final', status: 'pendente' },
                { tarefa: 'Briefing geral do staff', status: 'pendente' },
                { tarefa: 'Abertura dos portões', status: 'pendente' }
            ] }
        ];

        let dados = carregar();

        function carregar() {
            const salvo = localStorage.getItem(STORAGE_KEY);
            if (!salvo) return clonar(dadosIniciais);

            try {
                return JSON.parse(salvo);
            } catch {
                return clonar(dadosIniciais);
            }
        }

        function clonar(valor) {
            return JSON.parse(JSON.stringify(valor));
        }

        function salvar() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
            salvarSupabase();
        }

        async function carregarSupabase() {
            const { data, error } = await supabaseClient
                .from(SUPABASE_TABLE)
                .select('dados')
                .eq('id', SUPABASE_ROW_ID)
                .single();

            if (error || !data?.dados) {
                console.warn('Usando dados locais. Supabase não retornou dados:', error);
                return;
            }

            dados = data.dados;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
            renderizar();
        }

        async function salvarSupabase() {
            if (salvandoSupabase) return;
            salvandoSupabase = true;

            const { error } = await supabaseClient
                .from(SUPABASE_TABLE)
                .upsert({
                    id: SUPABASE_ROW_ID,
                    dados,
                    updated_at: new Date().toISOString()
                });

            if (error) {
                console.warn('Não foi possível salvar no Supabase:', error);
            }

            salvandoSupabase = false;
        }

        function iniciarRealtime() {
            supabaseClient
                .channel('cronograma-realtime')
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: SUPABASE_TABLE
                }, (payload) => {
                    if (payload.new?.id !== SUPABASE_ROW_ID) return;
                    if (!payload.new?.dados) return;

                    dados = payload.new.dados;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
                    renderizar();
                })
                .subscribe();
        }

        function renderizar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            dados.forEach((dia, diaIdx) => {
                const section = document.createElement('section');
                section.className = 'day';

                const tarefas = dia.tarefas.map((tarefa, tarefaIdx) => `
                    <article class="task status-${escapar(tarefa.status || 'pendente')}" draggable="true" data-dia="${diaIdx}" data-tarefa="${tarefaIdx}" data-responsavel="${escapar(tarefa.responsavel || '')}" ondragstart="dragStart(event, ${diaIdx}, ${tarefaIdx})" ondragend="dragEnd(event)">
                        <div class="task-row">
                            <div class="task-text" contenteditable="true" onblur="atualizarTarefa(${diaIdx}, ${tarefaIdx}, this.innerText)">${escapar(tarefa.tarefa)}</div>
                        </div>
                        <div class="task-controls">
                            <select class="status" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onchange="atualizarStatus(${diaIdx}, ${tarefaIdx}, this.value)" title="Status">
                                <option value="pendente" ${tarefa.status === 'pendente' ? 'selected' : ''}>⚪ Pendente</option>
                                <option value="urgente" ${tarefa.status === 'urgente' ? 'selected' : ''}>🔴 Urgente</option>
                                <option value="atrasado" ${tarefa.status === 'atrasado' ? 'selected' : ''}>⚠️ Atrasado</option>
                                <option value="andamento" ${tarefa.status === 'andamento' ? 'selected' : ''}>🟡 Andamento</option>
                                <option value="concluido" ${tarefa.status === 'concluido' ? 'selected' : ''}>🟢 Concluído</option>
                            </select>
                            <select class="responsavel resp-${tarefa.responsavel || ''}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onchange="atualizarResponsavel(${diaIdx}, ${tarefaIdx}, this)" title="Responsável">
                                <option value="" ${!tarefa.responsavel ? 'selected' : ''}>Resp.</option>
                                <option value="André" ${tarefa.responsavel === 'André' ? 'selected' : ''}>🦾 André</option>
                                <option value="Morgan" ${tarefa.responsavel === 'Morgan' ? 'selected' : ''}>🕷️ Morgan</option>
                                <option value="Juarez" ${tarefa.responsavel === 'Juarez' ? 'selected' : ''}>🥷 Juarez</option>
                                <option value="Tavares" ${tarefa.responsavel === 'Tavares' ? 'selected' : ''}>💪 Tavares</option>
                            </select>
                            <input class="horario" type="text" value="${escapar(tarefa.horario || '')}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" oninput="formatarHorario(this)" onblur="atualizarHorario(${diaIdx}, ${tarefaIdx}, this.value)" placeholder="00:00" maxlength="5" title="Horário">
                            <button class="delete" type="button" onclick="event.stopPropagation(); deletarTarefa(${diaIdx}, ${tarefaIdx})">×</button>
                        </div>
                    </article>
                `).join('');

                section.innerHTML = `
                    <div class="day-head">
                        <button class="trash-btn${(dia.lixeira && dia.lixeira.length) ? ' has-trash' : ''}" type="button" onclick="abrirLixeira(${diaIdx})" title="Lixeira">🗑️</button>
                        <div class="day-title" contenteditable="true" onblur="atualizarDia(${diaIdx}, this.innerText)">${escapar(dia.data)}</div>
                        <button class="add-task" type="button" onclick="adicionarTarefa(${diaIdx})">+</button>
                    </div>
                    <div class="tasks" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, ${diaIdx})">${tarefas}</div>
                `;

                calendar.appendChild(section);
            });

            aplicarFiltros();
            atualizarAlertasAtrasados();
        }

        function escapar(valor) {
            return String(valor || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function atualizarDia(diaIdx, valor) {
            dados[diaIdx].data = valor.trim() || 'Novo dia';
            salvar();
        }

        function atualizarTarefa(diaIdx, tarefaIdx, valor) {
            dados[diaIdx].tarefas[tarefaIdx].tarefa = valor.trim();
            salvar();
        }

        function atualizarStatus(diaIdx, tarefaIdx, valor) {
            dados[diaIdx].tarefas[tarefaIdx].status = valor;
            salvar();
            renderizar();
        }

        function atualizarAlertasAtrasados() {
            document.querySelectorAll('.status').forEach(select => {
                const option = select.querySelector('option[value="atrasado"]');
                if (!option) return;
                option.textContent = select.value === 'atrasado' && alertaPiscando ? '❗ Atrasado' : '⚠️ Atrasado';
            });
        }

        function atualizarResponsavel(diaIdx, tarefaIdx, selectEl) {
            const valor = selectEl.value;
            dados[diaIdx].tarefas[tarefaIdx].responsavel = valor;
            selectEl.className = 'responsavel resp-' + valor;
            salvar();
        }

        function formatarHorario(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 4) valor = valor.slice(0, 4);
            if (valor.length >= 3) {
                valor = valor.slice(0, 2) + ':' + valor.slice(2);
            }
            input.value = valor;
        }

        function atualizarHorario(diaIdx, tarefaIdx, valor) {
            dados[diaIdx].tarefas[tarefaIdx].horario = valor.trim();
            ordenarTarefasPorHorario(diaIdx);
            salvar();
            renderizar();
        }

        function ordenarTarefasPorHorario(diaIdx) {
            dados[diaIdx].tarefas.sort((a, b) => {
                const minA = horarioParaMinutos(a.horario);
                const minB = horarioParaMinutos(b.horario);

                if (minA === null && minB === null) return 0;
                if (minA === null) return 1;
                if (minB === null) return -1;

                return minA - minB;
            });
        }

        function horarioParaMinutos(horario) {
            const match = String(horario || '').match(/^(\d{1,2}):(\d{2})$/);
            if (!match) return null;

            const horas = Number(match[1]);
            const minutos = Number(match[2]);

            if (horas > 23 || minutos > 59) return null;
            return horas * 60 + minutos;
        }

        function adicionarTarefa(diaIdx) {
            dados[diaIdx].tarefas.push({ tarefa: 'Nova tarefa', status: 'pendente', responsavel: '', horario: '' });
            salvar();
            renderizar();
        }

        function deletarTarefa(diaIdx, tarefaIdx) {
            if (!confirm('Deseja realmente apagar esta tarefa?')) return;
            if (!dados[diaIdx].lixeira) dados[diaIdx].lixeira = [];
            const removida = dados[diaIdx].tarefas.splice(tarefaIdx, 1)[0];
            removida._apagadoPor = usuarioAtual || 'Desconhecido';
            removida._apagadoEm = new Date().toLocaleString('pt-BR');
            dados[diaIdx].lixeira.push(removida);
            salvar();
            renderizar();
        }

        function abrirLixeira(diaIdx) {
            if (!dados[diaIdx].lixeira) dados[diaIdx].lixeira = [];
            const lixeira = dados[diaIdx].lixeira;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

            let itensHtml = '';
            if (lixeira.length === 0) {
                itensHtml = '<div class="trash-empty">Lixeira vazia</div>';
            } else {
                itensHtml = lixeira.map((t, i) => `
                    <div class="trash-item">
                        <span class="trash-item-text">${escapar(t.tarefa)}${t._apagadoPor ? `<br><small style="color:var(--muted)">Apagado por: ${escapar(t._apagadoPor)}</small>` : ''}</span>
                        <div class="trash-item-actions">
                            <button class="trash-restore" onclick="restaurarTarefa(${diaIdx}, ${i})">↩</button>
                            <button class="trash-permadelete" onclick="deletarPermanente(${diaIdx}, ${i})">✕</button>
                        </div>
                    </div>
                `).join('');
            }

            overlay.innerHTML = `
                <div class="modal">
                    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                    <h2>🗑️ Lixeira — ${escapar(dados[diaIdx].data)}</h2>
                    ${itensHtml}
                </div>
            `;

            document.body.appendChild(overlay);
        }

        function restaurarTarefa(diaIdx, lixeiraIdx) {
            const tarefa = dados[diaIdx].lixeira.splice(lixeiraIdx, 1)[0];
            dados[diaIdx].tarefas.push(tarefa);
            salvar();
            document.querySelector('.modal-overlay').remove();
            renderizar();
        }

        function deletarPermanente(diaIdx, lixeiraIdx) {
            dados[diaIdx].lixeira.splice(lixeiraIdx, 1);
            salvar();
            document.querySelector('.modal-overlay').remove();
            abrirLixeira(diaIdx);
        }

        function dragStart(e, diaIdx, tarefaIdx) {
            if (e.target.closest('select, input, button')) {
                e.preventDefault();
                return;
            }

            dragDiaIdx = diaIdx;
            dragTarefaIdx = tarefaIdx;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.task.drag-over').forEach(el => el.classList.remove('drag-over'));
            dragDiaIdx = null;
            dragTarefaIdx = null;
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function dragLeave(e) {
            const task = e.target.closest('.task');
            if (task) task.classList.remove('drag-over');
        }

        function drop(e, destinoDiaIdx) {
            e.preventDefault();
            if (dragDiaIdx === null || dragTarefaIdx === null) return;
            if (dragDiaIdx === destinoDiaIdx) return;

            const tarefa = dados[dragDiaIdx].tarefas.splice(dragTarefaIdx, 1)[0];
            dados[destinoDiaIdx].tarefas.push(tarefa);
            salvar();
            renderizar();
        }

        function alternarTema() {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                btn.textContent = '🌙';
                localStorage.setItem(TEMA_KEY, 'light');
            } else {
                html.classList.add('dark');
                btn.textContent = '☀️';
                localStorage.setItem(TEMA_KEY, 'dark');
            }
        }

        function buscarTarefa() {
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            const responsavel = document.getElementById('responsavelFilter').value;
            document.querySelectorAll('.task.highlight').forEach(el => el.classList.remove('highlight'));

            let encontrado = false;
            document.querySelectorAll('.task').forEach(task => {
                const texto = task.querySelector('.task-text')?.innerText.toLowerCase() || '';
                const taskResponsavel = task.dataset.responsavel || '';
                const passaBusca = !termo || texto.includes(termo);
                const passaResponsavel = !responsavel || taskResponsavel === responsavel || (responsavel === '_sem_responsavel' && !taskResponsavel);

                if (passaBusca && passaResponsavel) {
                    task.style.display = '';
                } else {
                    task.style.display = 'none';
                }

                if (termo && passaBusca && passaResponsavel) {
                    task.classList.add('highlight');
                    if (!encontrado) {
                        task.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        encontrado = true;
                    }
                }
            });
        }

        function limparBusca() {
            document.getElementById('searchInput').value = '';
            document.getElementById('responsavelFilter').value = '';
            document.querySelectorAll('.task.highlight').forEach(el => el.classList.remove('highlight'));
            aplicarFiltros();
        }

        function gerarRelatorioIA() {
            const agora = new Date().toLocaleString('pt-BR');
            const contagemStatus = { pendente: 0, urgente: 0, atrasado: 0, andamento: 0, concluido: 0 };
            const contagemResponsavel = { 'André': 0, 'Morgan': 0, 'Juarez': 0, 'Tavares': 0, 'Sem responsável': 0 };
            let total = 0;

            dados.forEach(dia => {
                dia.tarefas.forEach(tarefa => {
                    total++;
                    contagemStatus[tarefa.status || 'pendente'] = (contagemStatus[tarefa.status || 'pendente'] || 0) + 1;
                    contagemResponsavel[tarefa.responsavel || 'Sem responsável'] = (contagemResponsavel[tarefa.responsavel || 'Sem responsável'] || 0) + 1;
                });
            });

            const concluidas = contagemStatus.concluido || 0;
            const progresso = total ? Math.round((concluidas / total) * 100) : 0;
            const linhasCronograma = dados.map(dia => {
                const tarefas = dia.tarefas.map((tarefa, idx) => {
                    const status = tarefa.status || 'pendente';
                    const responsavel = tarefa.responsavel || 'Sem responsável';
                    const horario = tarefa.horario ? ` [${tarefa.horario}]` : '';
                    return `${idx + 1}. [${status}] [${responsavel}]${horario} ${tarefa.tarefa}`;
                }).join('\n');
                return `${dia.data}\n${tarefas || 'Sem tarefas cadastradas'}`;
            }).join('\n\n');

            return `Você é um gerente de produção de eventos, especialista em montagem de camarotes, cenografia, elétrica, hidráulica, fornecedores, bares, mobiliário e operação.

Analise o cronograma abaixo considerando:
- O evento começa em 29/05 às 19h.
- Não pode haver margem de falha.
- Priorize tarefas com dependência estrutural.
- Identifique gargalos, riscos críticos, tarefas atrasadas e tarefas sem responsável.
- Reorganize a ordem de execução por prioridade real de montagem.
- Aponte o que precisa ser feito hoje, o que precisa ser feito nas próximas 24h e o que pode esperar.
- Sugira responsáveis e horários quando fizer sentido.
- Separe em: urgente, importante, pode esperar e risco crítico.
- Gere também uma mensagem objetiva para enviar no grupo da equipe.

RELATÓRIO GERAL - PLANEJAMENTO TREVO
Data de geração: ${agora}
Prazo final crítico: 29/05 às 19h
Contexto: Montagem de camarote/evento. Não pode haver margem de falha.
Progresso geral: ${progresso}%
Total de tarefas: ${total}

RESUMO POR STATUS:
- Pendente: ${contagemStatus.pendente || 0}
- Urgente: ${contagemStatus.urgente || 0}
- Atrasado: ${contagemStatus.atrasado || 0}
- Em andamento: ${contagemStatus.andamento || 0}
- Concluído: ${contagemStatus.concluido || 0}

RESUMO POR RESPONSÁVEL:
- André: ${contagemResponsavel['André'] || 0}
- Morgan: ${contagemResponsavel['Morgan'] || 0}
- Juarez: ${contagemResponsavel['Juarez'] || 0}
- Tavares: ${contagemResponsavel['Tavares'] || 0}
- Sem responsável: ${contagemResponsavel['Sem responsável'] || 0}

CRONOGRAMA POR DATA:

${linhasCronograma}`;
        }

        async function copiarRelatorioIA() {
            const relatorio = gerarRelatorioIA();
            try {
                await navigator.clipboard.writeText(relatorio);
                alert('Relatório copiado! Cole na IA para receber a análise.');
            } catch {
                prompt('Copie o relatório abaixo:', relatorio);
            }
        }

        function gerarStatusGeral() {
            const agora = new Date().toLocaleString('pt-BR');
            const linhas = [
                'STATUS GERAL DAS TAREFAS - PLANEJAMENTO TREVO',
                `Gerado em: ${agora}`,
                'Organização: por dia, responsável, horário e status',
                ''
            ];

            dados.forEach(dia => {
                linhas.push(`## ${dia.data}`);

                if (!dia.tarefas.length) {
                    linhas.push('- Sem tarefas cadastradas');
                    linhas.push('');
                    return;
                }

                dia.tarefas.forEach((tarefa, idx) => {
                    const horario = tarefa.horario ? ` | Horário: ${tarefa.horario}` : '';
                    const responsavel = tarefa.responsavel || 'Sem responsável';
                    const status = tarefa.status || 'pendente';
                    linhas.push(`${idx + 1}. [${status}] [${responsavel}]${horario} - ${tarefa.tarefa}`);
                });

                linhas.push('');
            });

            return linhas.join('\n');
        }

        async function copiarStatusGeral() {
            const statusGeral = gerarStatusGeral();
            try {
                await navigator.clipboard.writeText(statusGeral);
                alert('Status geral copiado!');
            } catch {
                prompt('Copie o status geral abaixo:', statusGeral);
            }
        }

        async function analisarComIA() {
            const relatorio = gerarRelatorioIA();
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                    <h2>🤖 Análise IA da montagem</h2>
                    <div id="iaResultado" style="white-space:pre-wrap;font-size:0.85rem;line-height:1.45;color:var(--text)">Analisando cronograma atualizado...</div>
                </div>
            `;
            document.body.appendChild(overlay);

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/analisar-cronograma`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ relatorio })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Erro ao gerar análise com IA.');
                }

                document.getElementById('iaResultado').innerText = result.analise || 'A IA não retornou uma análise.';
            } catch (error) {
                document.getElementById('iaResultado').innerText = `Não foi possível gerar a análise automática.\n\nMotivo: ${error.message}\n\nComo alternativa, o relatório foi copiado para você colar manualmente na IA.`;
                try {
                    await navigator.clipboard.writeText(relatorio);
                } catch {}
            }
        }

        function selecionarUsuario() {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

            const icones = { 'André': '🦾', 'Tavares': '💪', 'Juarez': '🥷', 'Morgan': '🕷️' };
            const responsaveis = ['André', 'Morgan', 'Juarez', 'Tavares'];
            const botoes = responsaveis.map(r => `
                <button style="display:block;width:100%;margin-bottom:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#f7fafc;cursor:pointer;font-size:0.9rem;text-align:left" onclick="definirUsuario('${r}')">${icones[r]} ${r}</button>
            `).join('');

            overlay.innerHTML = `
                <div class="modal">
                    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                    <h2>Quem está acessando?</h2>
                    ${botoes}
                </div>
            `;

            document.body.appendChild(overlay);
        }

        function definirUsuario(nome) {
            usuarioAtual = nome;
            localStorage.setItem(USUARIO_KEY, nome);
            atualizarBadge();
            document.querySelector('.modal-overlay').remove();
        }

        function iconeUsuario(nome) {
            const map = { 'André': '🦾', 'Tavares': '💪', 'Juarez': '🥷', 'Morgan': '🕷️' };
            return map[nome] || '👤';
        }

        function atualizarBadge() {
            const badge = document.getElementById('userBadge');
            if (badge) {
                badge.innerHTML = usuarioAtual ? `${iconeUsuario(usuarioAtual)} ${usuarioAtual}` : '👤 ...';
            }
        }

        if (localStorage.getItem(TEMA_KEY) === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('themeToggle').textContent = '☀️';
        }

        if (!usuarioAtual) {
            selecionarUsuario();
        } else {
            atualizarBadge();
        }

        renderizar();
        carregarSupabase();
        iniciarRealtime();
        setInterval(() => {
            alertaPiscando = !alertaPiscando;
            atualizarAlertasAtrasados();
        }, 800);
    </script>
</body>
</html>
